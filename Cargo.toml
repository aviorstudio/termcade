[workspace]
members = ["crates/sdk", "crates/manifest", "crates/plugin", "crates/registry"]
exclude = ["crates/plugin/testdata/probe-rust", "crates/plugin/testdata/hang-rust"]
resolver = "3"

[package]
name = "termcade"
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
toml = "=0.9.12"
anyhow = "1"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.34"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "process", "sync"] }
url = "2"
uuid = { version = "=1.29.0", features = ["v4"] }
unicode-width = "0.2"
termcade-sdk = { path = "crates/sdk" }
termcade-manifest = { path = "crates/manifest" }
termcade-plugin = { path = "crates/plugin" }
termcade-registry = { path = "crates/registry" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[profile.release]
lto = "thin"
strip = true
