[game]
id          = "aviorstudio/tetris"
name        = "Tetris"
version     = "1.0.0"
description = "Falling tetromino line clearer"

[requirements]
abi    = 1  # termcade wasm ABI major version
width  = 32 # logical playfield; must match the game's Info
height = 40

[controls]
"←/→"   = "shift"
"↑"     = "rotate"
"↓"     = "soft drop"
"space" = "hard drop"
