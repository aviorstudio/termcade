[tools]
"python" = "3.13.11"
"rust" = "1.94.0"
"cargo:cargo-audit" = "0.22.2"
"actionlint" = "1.7.12"
"shellcheck" = "0.11.0"

[env]
PYTHONDONTWRITEBYTECODE = "1"
CARGO_INCREMENTAL = "0"
CARGO_TARGET_DIR = "{{config_root}}/.artifacts/rust-target"
CARGO_BUILD_JOBS = "2"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_PROFILE_DEV_DEBUG = "0"
PYTHONUTF8 = "1"
