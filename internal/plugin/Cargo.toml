[package]
name = "termcade-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
termcade-sdk = { path = "../../sdk" }
tokio = { version = "1", features = ["time"] }
# Supported LTS security patch; newer trains need a newer Rust toolchain.
wasmtime = { version = "=36.0.20", default-features = false, features = ["std", "runtime", "cranelift", "async"] }
wasmtime-wasi = { version = "=36.0.20", default-features = false, features = ["preview1"] }

[dev-dependencies]
termcade-manifest = { path = "../../manifest" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wat = "1"
