name: Godot Rendering Dependencies
description: Install the private X server and Mesa software renderer used by real viewport tests.
runs:
  using: composite
  steps:
    - name: Install virtual display and software OpenGL
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
