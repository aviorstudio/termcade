name: Build
description: >
  Everything a release ships: the arcade binary for every platform, archived,
  the starter pack's .tcade packages, and checksums over all of it.

  Shared by CI and Release so a pull request builds exactly what a release
  builds, with no switches between them. The only difference is that one of
  them goes on to publish.

  NOTHING LEAVES THE RUNNER. The archives are left in ./dist; creating the
  tag and the GitHub release is the caller's move.

inputs:
  version:
    description: Version to stamp into the binary (without the v)
    required: false
    default: dev

runs:
  using: composite
  steps:
    - name: Cross-compile
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p dist
        # linux/386 and friends excluded on purpose: wazero's compiler backend
        # covers amd64/arm64, and everything else falls back to the
        # interpreter — playable, but not something worth publishing.
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          GOOS="${target%/*}"; GOARCH="${target#*/}"
          bin=termcade
          [ "$GOOS" = windows ] && bin=termcade.exe
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/$bin" .
          name="termcade_$(echo "$GOOS" | sed 's/./\U&/')_${GOARCH}"
          case "$GOARCH" in amd64) name="termcade_$(echo "$GOOS" | sed 's/./\U&/')_x86_64";; esac
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q "${name}.zip" "$bin" && rm "$bin")
          else
            tar -czf "dist/${name}.tar.gz" -C dist "$bin" && rm "dist/$bin"
          fi
        done

    # The starter pack, shipped as marketplace packages too.
    #
    # COPIED, not rebuilt. internal/starter/packs/*.tcade are committed (see
    # the note in internal/starter/starter.go), and copying them is what makes
    # the package the marketplace serves byte-identical to the one embedded in
    # the binary. A `go generate` here would rebuild the wasm and could hand
    # the registry a different digest for the same game and version.
    #
    # This is how asteroid and tetris reach the registry at all: they have no
    # repository of their own, so their packages are assets on this repo's
    # releases, and `termcade publish` points the marketplace at them.
    - name: Starter packages
      shell: bash
      run: |
        set -euo pipefail
        cp internal/starter/packs/*.tcade dist/
        ls -l dist/*.tcade

    - name: Checksums
      shell: bash
      run: |
        set -euo pipefail
        (cd dist && sha256sum *.tar.gz *.zip *.tcade > checksums.txt)
        cat dist/checksums.txt
