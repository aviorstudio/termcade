name: Test
description: >
  Is this commit good. Nothing is built for release here and nothing is
  published; a failure means the code is wrong, not that the pipeline is.

  One definition, called by CI and by Release both. Two would drift in a
  single direction: the copy guarding the release gets trimmed to make
  releases faster, until it no longer matches the one people trust on a pull
  request.

  Assumes Go is already set up; the caller owns the toolchain and its caches.

runs:
  using: composite
  steps:
    - name: Formatting, vet, race and independent consumer checks
      shell: bash
      run: make lint test
