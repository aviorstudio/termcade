name: Test
description: >
  Is this commit good. Nothing is built for release here and nothing is
  published; a failure means the code is wrong, not that the pipeline is.

  One definition, called by CI and by Release both. Two would drift in a
  single direction: the copy guarding the release gets trimmed to make
  releases faster, until it no longer matches the one people trust on a pull
  request.

  Assumes Go is already set up; the caller owns the toolchain and its caches.

runs:
  using: composite
  steps:
    # Cheapest first, and the one most likely to be the only thing wrong.
    - name: Go formatting
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt would change these files:"
          echo "$unformatted"
          exit 1
        fi

    - name: Go vet
      shell: bash
      run: |
        go vet ./...
        go vet ./sdk/...

    # -race because the shell runs marketplace commands as goroutines feeding
    # messages back into the model, which is exactly the shape that fails only
    # under load. -count=1 because a cached PASS from an earlier run is not
    # evidence about this one — the plugin suite builds and executes wasm from
    # the working tree.
    #
    # Both workspace modules in one invocation: the arcade and the sdk release
    # together or not at all.
    - name: Go tests
      shell: bash
      run: go test -race -count=1 -timeout 10m ./... ./sdk/...

    # Everything above runs inside go.work, where ./sdk satisfies the arcade's
    # dependency on it — so the version in go.mod is never consulted and can
    # be wrong without anything noticing. That is exactly how v0.0.3 shipped
    # using sdk.ASCII while requiring an sdk release that predated it: green
    # locally, green here, and broken for every `go run …@latest` on earth.
    #
    # GOWORK=off resolves the dependency the way a stranger's toolchain will.
    # It is the only check in this file that tests the module rather than the
    # code, and it belongs in the shared action so a release cannot skip it.
    - name: Build as a consumer would
      shell: bash
      run: |
        GOWORK=off go build ./...
        GOWORK=off go vet ./...
