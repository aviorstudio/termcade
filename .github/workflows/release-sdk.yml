name: Release SDK

# Cut an SDK release: bump the sdk/v* tag and publish a tag-only GitHub
# release. No artifacts — the SDK is a Go module, and the tag IS the release;
# `go get github.com/aviorstudio/termcade/sdk@sdk/v0.0.2` resolves the moment
# the tag exists. The sdk/ prefix is not a house style choice: Go requires it
# for a module in a subdirectory.
#
# Bump discipline: the wasm ABI is part of the SDK contract. An ABI change is
# never a patch.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency: release-sdk-${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          prefix="sdk/v"
          git fetch --tags --force
          latest="$(git tag --list "${prefix}[0-9]*" | sed -E "s|^${prefix}||" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          tag="${prefix}${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The release gate is the same suite CI runs; the SDK never releases
      # from a commit the arcade's tests wouldn't pass.
      - name: Test
        uses: ./.github/actions/test

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#sdk/}"
          cat > notes.md <<NOTES
          termcade sdk $version

          \`\`\`sh
          go get github.com/aviorstudio/termcade/sdk@$version
          \`\`\`

          See docs/sdk.md for the author quickstart and docs/abi.md for the
          wasm ABI this SDK targets.
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md
