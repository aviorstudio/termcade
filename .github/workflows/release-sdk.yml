name: SDK Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
permissions: {}
concurrency: release-sdk-${{ github.repository }}
jobs:
  release:
    name: Release SDK
    runs-on: ubuntu-24.04
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Determine release version
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |-
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo 'Run releases from the main branch.' >&2
          exit 1
        fi
        prefix="sdk/v"
        git fetch --tags --force
        latest="$(git tag --list "${prefix}[0-9]*" | sed -E "s|^${prefix}||" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          version="0.0.1"
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
        fi
        python3 - "$version" <<'PYSDK'
        import sys,tomllib
        from pathlib import Path
        version=tomllib.loads(Path("sdk/Cargo.toml").read_text())["package"]["version"]
        if version!=sys.argv[1]:
            raise SystemExit(f"Commit the Cargo package version {sys.argv[1]} before releasing (currently {version}).")
        PYSDK
        tag="${prefix}${version}"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Tag already exists: $tag" >&2
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Set up development tools
      uses: nicodes/tools/setup@f412061a7a3f0914db9e09d1159e69504aee8706
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install pinned build and validation tools
      shell: bash
      run: |-
        set -euo pipefail
        mise run install
    - name: Test
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |-
        set -euo pipefail
        version="${TAG#sdk/}"
        mkdir -p .artifacts
        cat > .artifacts/sdk-release-notes.txt <<NOTES
        termcade sdk $version

        \`\`\`sh
        cargo add termcade-sdk --git https://github.com/aviorstudio/termcade --tag "$TAG"
        \`\`\`

        See README.md for the author quickstart and the
        wasm ABI this SDK targets.
        NOTES
        gh release create "$TAG" --target "$GITHUB_SHA" \
          --title "$TAG" --notes-file .artifacts/sdk-release-notes.txt
