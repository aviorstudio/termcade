name: CI

# Every push and pull request: test, then build, on one runner.
#
# Nothing is published, so a green CI means one thing — this commit is good.
# The steps are .github/actions/*, the same ones Release runs; one definition
# of each, and it is the one guarding a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Built first: a compile error should fail before a test suite spends
      # minutes reaching the same conclusion more slowly. This is the order
      # every other workflow in the organisation uses.
      - name: Build
        uses: ./.github/actions/build

      - name: Test
        uses: ./.github/actions/test
