name: "Build & Test"

# Every push and pull request: test, then build, on one runner.
#
# Nothing is published, so a green CI means one thing — this commit is good.
# The steps are .github/actions/*, the same ones Release runs; one definition
# of each, and it is the one guarding a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Test"
    runs-on: ubuntu-24.04
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        uses: nicodes/tools/integration-identity@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
      - name: "Set up tools"
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Install pinned build and validation tools
        run: make install

      # Built first: a compile error should fail before a test suite spends
      # minutes reaching the same conclusion more slowly. This is the order
      # every other workflow in the organisation uses.
      - name: Build
        uses: ./.github/actions/build

      - name: Test
        uses: ./.github/actions/test
